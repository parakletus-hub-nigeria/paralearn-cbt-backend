# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ParalearnCBT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Windows runner so native modules (bcrypt, Prisma engine) match the Windows App Service
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, generate Prisma client, build
        run: |
          npm ci
          npx prisma generate
          npm run build

      # Ship only what runs in production: dev tooling (Nest CLI, TypeScript, Prisma CLI)
      # made the package too large to extract on the App Service disk
      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # Prisma ships WASM/edge engines for every database (~70 MB). The Node app on Windows only loads
      # runtime/library.js and .prisma/client/query_engine-windows.dll.node, so drop the rest.
      - name: Trim runtime package
        shell: pwsh
        run: |
          $runtime = "node_modules/@prisma/client/runtime"
          Get-ChildItem $runtime -File |
            Where-Object { $_.Name -match '(wasm|^query_|^edge|^react-native|\.map$|\.mjs$)' } |
            Remove-Item -Force
          Get-ChildItem node_modules/.prisma/client -File |
            Where-Object { $_.Name -match '(\.wasm$|^wasm|^edge)' } |
            Remove-Item -Force
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue node_modules/prisma, node_modules/@prisma/engines
          Get-ChildItem node_modules -Recurse -File -Include *.map, *.md, *.markdown |
            Remove-Item -Force
          "node_modules size: {0:N1} MB" -f ((Get-ChildItem node_modules -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item -Recurse dist, node_modules, prisma, package.json, package-lock.json, web.config -Destination release
          Compress-Archive -Path release\* -DestinationPath release.zip -CompressionLevel Optimal
          "Package size: {0:N1} MB" -f ((Get-Item release.zip).Length / 1MB)

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ParalearnCBT'
          slot-name: 'Production'
          package: release.zip
          type: zip
          # Remove files left in wwwroot by earlier full-repo deployments
          clean: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A3BDF8ECB32A4920981340EDA5441374 }}
